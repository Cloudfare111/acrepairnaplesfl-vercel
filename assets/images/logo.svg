<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 50" width="100%" height="100%">
  <defs>
    <linearGradient id="coolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
  </defs>

  <!-- Modern Badge Icon Mark -->
  <g transform="translate(4, 5)">
    <rect x="0" y="0" width="40" height="40" rx="10" fill="url(#coolGrad)"/>
    <!-- Snowflake & Cooling Breeze Icon -->
    <g transform="translate(20, 20)">
      <circle r="3" fill="#FFFFFF"/>
      <circle r="1.5" fill="#0284c7"/>
      <!-- Snowflake Rays -->
      <g>
        <line x1="0" y1="-3" x2="0" y2="-13" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M-3 -8 L0 -12 L3 -8" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g transform="rotate(60)">
        <line x1="0" y1="-3" x2="0" y2="-13" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M-3 -8 L0 -12 L3 -8" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g transform="rotate(120)">
        <line x1="0" y1="-3" x2="0" y2="-13" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M-3 -8 L0 -12 L3 -8" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g transform="rotate(180)">
        <line x1="0" y1="-3" x2="0" y2="-13" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M-3 -8 L0 -12 L3 -8" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g transform="rotate(240)">
        <line x1="0" y1="-3" x2="0" y2="-13" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M-3 -8 L0 -12 L3 -8" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g transform="rotate(300)">
        <line x1="0" y1="-3" x2="0" y2="-13" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M-3 -8 L0 -12 L3 -8" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
  </g>

  <!-- Typography -->
  <text x="52" y="24" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="800" fill="#0f2438" letter-spacing="-0.02em">AC Repair</text>
  <text x="142" y="24" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="700" fill="#0284c7" letter-spacing="-0.01em">Naples FL</text>
  <text x="52" y="38" font-family="'Inter', system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#64748b" letter-spacing="0.14em">PREMIUM COOLING &amp; HVAC SOLUTIONS</text>
</svg>