<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="100%" height="100%">
  <defs>
    <linearGradient id="sunGradW" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="60%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>

    <linearGradient id="coolGradW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="swooshGradW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="70%" stop-color="#C2410C"/>
      <stop offset="100%" stop-color="#9A3412"/>
    </linearGradient>
  </defs>

  <!-- ==================== EMBLEM ==================== -->
  <g id="emblem" transform="translate(4, 2)">
    <!-- 1. Rising Golden Sun with Radiant Rays (Upper Right) -->
    <g id="sun">
      <path d="M 46,36 Q 58,16 75,34 Z" fill="url(#sunGradW)"/>
      
      <!-- Sunburst Rays -->
      <polygon points="52,19 55,8 58,18" fill="#F59E0B"/>
      <polygon points="63,22 71,13 68,23" fill="#F59E0B"/>
      <polygon points="72,27 82,23 75,30" fill="#F59E0B"/>
      <polygon points="76,34 86,34 77,38" fill="#F59E0B"/>
      <polygon points="45,21 44,11 49,20" fill="#F59E0B"/>
    </g>

    <!-- 2. House Structure with Peaked Roof & Window Panes -->
    <g id="house">
      <!-- Roof Peak in White -->
      <path d="M 22,46 L 45,26 L 68,46 L 63,49 L 45,33 L 27,49 Z" fill="#FFFFFF"/>
      
      <!-- House Body Outline -->
      <path d="M 29,48 L 29,66 L 61,66 L 61,48" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- 4-Pane Window -->
      <g id="window" transform="translate(40, 48)">
        <rect x="0" y="0" width="10" height="10" rx="1" fill="#0F2438" stroke="#FFFFFF" stroke-width="1.8"/>
        <line x1="5" y1="0" x2="5" y2="10" stroke="#FFFFFF" stroke-width="1.2"/>
        <line x1="0" y1="5" x2="10" y2="5" stroke="#FFFFFF" stroke-width="1.2"/>
      </g>
    </g>

    <!-- 3. Half Snowflake (Cooling/Air Conditioning on Left) -->
    <g id="snowflake" stroke="url(#coolGradW)" stroke-linecap="round" stroke-linejoin="round">
      <!-- Upper Left Branch -->
      <line x1="34" y1="30" x2="16" y2="18" stroke-width="2.8"/>
      <path d="M 22,17 L 16,18 L 19,25" fill="none" stroke-width="2.2"/>
      <path d="M 27,24 L 22,22 L 25,28" fill="none" stroke-width="1.8"/>

      <!-- Mid-Left Branch -->
      <line x1="28" y1="40" x2="10" y2="40" stroke-width="2.8"/>
      <path d="M 16,35 L 10,40 L 16,45" fill="none" stroke-width="2.2"/>
      <path d="M 22,36 L 18,40 L 22,44" fill="none" stroke-width="1.8"/>

      <!-- Lower Left Branch -->
      <line x1="30" y1="50" x2="14" y2="60" stroke-width="2.8"/>
      <path d="M 18,53 L 14,60 L 21,60" fill="none" stroke-width="2.2"/>
      <path d="M 24,49 L 20,54 L 26,56" fill="none" stroke-width="1.8"/>
    </g>

    <!-- 4. Dynamic Surrounding Wave / Swoosh Arc -->
    <g id="swoosh">
      <path d="M 72,66 C 54,74 30,73 17,62 C 6,51 5,34 14,20 C 17,15 22,10 26,8 C 22,13 16,24 16,36 C 16,52 30,65 52,64 C 61,64 70,61 77,57 C 76,61 74,64 72,66 Z" fill="url(#swooshGradW)"/>
    </g>
  </g>

  <!-- ==================== TYPOGRAPHY ==================== -->
  <g id="text" transform="translate(94, 0)">
    <!-- Top Line: PREMIUM (White) -->
    <text x="0" y="32" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" letter-spacing="0.04em">PREMIUM</text>

    <!-- Middle Line: AC SOLUTIONS (Coral) -->
    <text x="0" y="56" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="21.5" font-weight="800" fill="#EA580C" letter-spacing="0.06em">AC SOLUTIONS</text>

    <!-- Bottom Line: KEEPING NAPLES COOL -->
    <g transform="translate(0, 69)">
      <line x1="0" y1="-3" x2="32" y2="-3" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
      <text x="38" y="0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="800" fill="#E2E8F0" letter-spacing="0.22em">KEEPING NAPLES COOL</text>
      <line x1="202" y1="-3" x2="242" y2="-3" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>
</svg>